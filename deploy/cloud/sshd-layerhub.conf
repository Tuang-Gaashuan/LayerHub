# Copy to /etc/ssh/sshd_config.d/60-layerhub-relay.conf AFTER creating the user.
# Validate effective settings with sshd -T -C before reloading ssh.
Match User layerhub-relay
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitListen 127.0.0.1:15181
    PermitOpen none
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    MaxSessions 0
Match all
